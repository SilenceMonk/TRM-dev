[program:cifar10_looped_flows_v2_jit]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/cifar10_looped_flows_v2_jit.sh
autostart=false
autorestart=unexpected
exitcodes=0
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=300
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
